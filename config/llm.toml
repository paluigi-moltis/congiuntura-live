# ══════════════════════════════════════════════════════════════════
# congiuntura-live — LLM processing configuration (outlines-cascade)
# ══════════════════════════════════════════════════════════════════
#
# This is a native outlines-cascade config file. It defines providers
# and cascades for structured generation.
#
# API keys are NEVER stored here — only the environment variable name
# (api_key_env). Put the actual key in your .env file:
#   OPENROUTER_API_KEY=sk-or-v1-...
#
# The primary provider is Groq (cloud), which gives access to
# many models via an OpenAI-compatible API.

# ─── Providers ───────────────────────────────────────────────

[providers.llm7]
type = "openai"
base_url = "https://api.llm7.io/v1"
api_key_env = "LLM7_API_KEY"

[providers.groq]
type = "openai"
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"

# ─── Cascades ────────────────────────────────────────────────
# Tried in order: if the first fails, the next is attempted.

[cascades.congiuntura]
entries = [
    
    { provider = "groq", model = "openai/gpt-oss-120b" },
    { provider = "llm7", model = "gpt-5.4-mini" },
    { provider = "groq", model = "qwen/qwen3.6-27b" },
    { provider = "llm7", model = "kimi-k3" },
    { provider = "llm7", model = "deepseek-ai/deepseek-v4-flash" },
    { provider = "groq", model = "openai/gpt-oss-20b" },
    { provider = "llm7", model = "deepseek-v4-flash" },
    { provider = "llm7", model = "minimax-m2.7" },
    { provider = "llm7", model = "gpt-oss:20b" },
]
