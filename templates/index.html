{% extends "base.html" %}
{% block nav_main %}active{% endblock %}
{% block content %}

<!-- Filter form: all selects live here so hx-include="closest form" collects all values -->
<form id="filter-form" class="search-bar">

    <label>
        Publisher
        <select name="publisher" multiple size="5"
                hx-get="/search"
                hx-trigger="change delay:200ms"
                hx-target="#results"
                hx-include="closest form"
                hx-swap="innerHTML">
            {% for slug, name in publishers %}
            <option value="{{ slug }}">{{ name }}</option>
            {% endfor %}
        </select>
        <span class="hint">Hold Ctrl/Cmd to select multiple</span>
    </label>

    {% for filter in filters %}
    <label>
        {{ filter.name | replace('_', ' ') | capitalize }}
        <select name="{{ filter.name }}" multiple size="5"
                hx-get="/search"
                hx-trigger="change delay:200ms"
                hx-target="#results"
                hx-include="closest form"
                hx-swap="innerHTML">
            {% for choice in filter.choices %}
            <option value="{{ choice }}">{{ choice }}</option>
            {% endfor %}
        </select>
        <span class="hint">Hold Ctrl/Cmd to select multiple</span>
    </label>
    {% endfor %}

    <label>
        From
        <input type="date" name="date_from"
               hx-get="/search"
               hx-trigger="change"
               hx-target="#results"
               hx-include="closest form"
               hx-swap="innerHTML">
    </label>

    <label>
        To
        <input type="date" name="date_to"
               hx-get="/search"
               hx-trigger="change"
               hx-target="#results"
               hx-include="closest form"
               hx-swap="innerHTML">
    </label>

    <button type="button"
            class="reprocess-btn"
            hx-post="/reprocess"
            hx-target="#stats"
            hx-swap="outerHTML"
            {% if not processing_enabled %}disabled title="Processing not enabled"{% endif %}>
        ♻ Reprocess pending
    </button>
</form>

{% include "_stats.html" with context %}

<div id="results" hx-get="/search" hx-trigger="load" hx-swap="innerHTML">
    <p class="empty">Loading…</p>
</div>

{% endblock %}
