{% extends "base.html" %}
{% block nav_raw %}active{% endblock %}
{% block content %}

<form id="filter-form" class="search-bar">
    <label>
        Publisher
        <select name="publisher"
                hx-get="/search-raw"
                hx-trigger="change"
                hx-target="#results"
                hx-include="closest form"
                hx-swap="innerHTML">
            <option value="all">All agencies</option>
            {% for slug, name in publishers %}
            <option value="{{ slug }}">{{ name }}</option>
            {% endfor %}
        </select>
    </label>

    <label>
        From
        <input type="date" name="date_from"
               hx-get="/search-raw"
               hx-trigger="change"
               hx-target="#results"
               hx-include="closest form"
               hx-swap="innerHTML">
    </label>

    <label>
        To
        <input type="date" name="date_to"
               hx-get="/search-raw"
               hx-trigger="change"
               hx-target="#results"
               hx-include="closest form"
               hx-swap="innerHTML">
    </label>
</form>

<div class="stats">
    <span>{{ total }} raw releases in database</span>
</div>

<div id="results" hx-get="/search-raw" hx-trigger="load" hx-swap="innerHTML">
    <p class="empty">Loading…</p>
</div>

{% endblock %}
