<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congiuntura Live</title>
    <!-- Pico CSS (classless, zero-build) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/css@2/pico.min.css">
    <style>
        body { max-width: 1200px; margin: 0 auto; padding: 1rem 1.5rem; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; }
        header h1 { margin-bottom: 0; }
        header .subtitle { color: var(--muted-color); font-size: 0.9rem; }
        nav a { margin-left: 1rem; text-decoration: none; }
        nav a.active { font-weight: bold; text-decoration: underline; }
        .search-bar {
            display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;
            padding: 1rem; background: var(--card-background-color);
            border-radius: 8px; margin-bottom: 1.5rem;
        }
        .search-bar label { margin-bottom: 0; flex: 1; min-width: 140px; }
        .search-bar select, .search-bar input { margin-bottom: 0; }
        .reprocess-btn { margin-bottom: 0; white-space: nowrap; }
        .reprocess-btn:disabled { opacity: 0.5; }
        .stats { font-size: 0.85rem; color: var(--muted-color); margin-bottom: 0.5rem; }
        .badge {
            display: inline-block; padding: 0.15rem 0.5rem;
            border-radius: 4px; font-size: 0.8rem; font-weight: 600;
            background: var(--primary); color: var(--primary-inverse);
            white-space: nowrap;
        }
        .badge.eurostat { background: #0064c8; }
        .badge.istat { background: #005e4a; }
        .badge.ine { background: #c8102e; }
        .badge.insee { background: #000091; }
        .badge.destatis { background: #444; }
        .empty { text-align: center; color: var(--muted-color); padding: 2rem; }
        .flash { padding: 1rem; background: #e8f5e9; border-radius: 4px; margin-bottom: 1rem; }

        /* ── Processed cards ── */
        .card {
            border: 1px solid var(--table-border-color); border-radius: 8px;
            padding: 1rem; margin-bottom: 1rem; background: var(--card-background-color);
        }
        .card-header { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
        .card-header .topic { font-weight: 600; }
        .card-header .country { color: var(--muted-color); font-size: 0.9rem; }
        .card-header .sentiment { font-size: 0.8rem; font-weight: 600; padding: 0.1rem 0.4rem; border-radius: 3px; }
        .sentiment-positive { background: #d4edda; color: #155724; }
        .sentiment-negative { background: #f8d7da; color: #721c24; }
        .sentiment-neutral  { background: #e2e3e5; color: #383d41; }
        .card h3 { margin: 0.3rem 0; font-size: 1.05rem; }
        .card h3 a { text-decoration: none; }
        .summary-en { font-size: 0.95rem; margin: 0.3rem 0; }
        .key-figures { font-size: 0.85rem; color: var(--muted-color); margin: 0.3rem 0; font-family: monospace; }
        .card-footer { display: flex; gap: 1rem; font-size: 0.8rem; color: var(--muted-color); margin-top: 0.5rem; }
        .card-footer .model { margin-left: auto; }

        /* ── Raw table ── */
        #results table { width: 100%; }
        #results td { vertical-align: top; padding: 0.75rem 0.5rem; }
        #results tr { border-bottom: 1px solid var(--table-border-color); }
        .feed-label { font-size: 0.75rem; color: var(--muted-color); margin-top: 0.2rem; }
        .summary { font-size: 0.85rem; color: var(--muted-color); margin-top: 0.3rem; }

        footer { text-align: center; margin-top: 3rem; color: var(--muted-color); font-size: 0.8rem; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>📊 Congiuntura Live</h1>
            <div class="subtitle">European statistics press releases — Eurostat · Istat · INE · INSEE · Destatis</div>
        </div>
        <nav>
            <a href="/" class="{% block nav_main %}{% endblock %}">Processed</a>
            <a href="/raw" class="{% block nav_raw %}{% endblock %}">Raw feeds</a>
        </nav>
    </header>

    {% block content %}{% endblock %}

    <footer>
        <p>Congiuntura Live · <a href="https://github.com/paluigi-moltis/congiuntura-live">GitHub</a></p>
    </footer>

    <!-- Datastar SDK -->
    <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.1/bundles/datastar.js"></script>
</body>
</html>
